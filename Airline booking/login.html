<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SkyWay Airlines</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="login-page">
    <div class="animated-background">
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="cloud cloud3"></div>
        <div class="plane"></div>
    </div>

    <header>
        <div class="logo">
            <h1><i class="fas fa-plane"></i> SkyWay Airlines</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="flights.html">Flights</a></li>
                <li><a href="destinations.html">Destinations</a></li>
                <li><a href="deals.html">Deals</a></li>
                <li><a href="login.html" class="active">Login</a></li>
                <li><a href="register.html" class="cta-button">Sign Up</a></li>
            </ul>
        </nav>
        <div class="mobile-menu-btn">
            <i class="fas fa-bars"></i>
        </div>
    </header>

    <div class="login-container">
        <div class="form-card">
            <div class="form-header">
                <h2>Welcome Back</h2>
                <p>Sign in to your SkyWay Airlines account</p>
            </div>
            
            <form id="login-form" class="animated-form">
                <div class="form-group">
                    <div class="input-container">
                        <input type="email" id="email" required>
                        <label for="email">Email Address</label>
                        <span class="focus-border"></span>
                    </div>
                    <div class="error-message" id="email-error"></div>
                </div>
                
                <div class="form-group">
                    <div class="input-container">
                        <input type="password" id="password" required>
                        <label for="password">Password</label>
                        <span class="focus-border"></span>
                        <i class="toggle-password fas fa-eye-slash"></i>
                    </div>
                    <div class="error-message" id="password-error"></div>
                </div>
                
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="remember">
                    <label for="remember">Remember me</label>
                </div>
                
                <button type="submit" class="submit-btn">
                    <span class="btn-text">Sign In</span>
                    <span class="btn-loader"></span>
                </button>
                
                <div class="forgot-password">
                    <a href="#">Forgot Password?</a>
                </div>
            </form>
            
            <div class="social-login">
                <p>Or sign in with</p>
                <div class="social-buttons">
                    <button class="social-btn google">
                        <i class="fab fa-google"></i>
                        <span>Google</span>
                    </button>
                    <button class="social-btn facebook">
                        <i class="fab fa-facebook-f"></i>
                        <span>Facebook</span>
                    </button>
                </div>
            </div>
            
            <div class="form-footer">
                <p>Don't have an account? <a href="register.html">Sign Up</a></p>
            </div>
        </div>
    </div>

    <script src="assets/js/script.js"></script>
</body>
</html>
